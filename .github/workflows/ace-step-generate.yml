name: ACE-Step Generate Private Audio

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Private draft release ID containing request.json"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ace-step-private-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ACESTEP_COMMIT: ca1e85fe9430179831e6bc6be790c332190a3866
      ACESTEP_INIT_LLM: "false"
      ACESTEP_COMPILE_MODEL: "false"
      ACE_STEP_SUPPRESS_AUDIO_TOKENS: "1"
      ACE_STEP_MAX_DURATION_SECONDS: "30"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate private task handle
        shell: bash
        run: |
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid draft release ID" >&2
            exit 2
          fi

      - name: Reclaim unused runner disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          df -h /

      - name: Install CPU benchmark tooling
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download private request asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')
          if [ "$DRAFT" != "true" ]; then
            echo "ACE-Step task release must remain draft/private" >&2
            exit 3
          fi

          REQUEST_ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name == "request.json") | .id' | head -n1)
          if ! [[ "$REQUEST_ASSET_ID" =~ ^[0-9]+$ ]]; then
            echo "Private request.json asset not found" >&2
            exit 4
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$REQUEST_ASSET_ID" > /tmp/request.json
          test -s /tmp/request.json

          # Make a workflow rerun idempotent without touching the private request.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name == "ace-step.wav" or .name == "result.json" or .name == "failure.txt") | .id' \
            | while read -r asset_id; do
                [ -n "$asset_id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done

      - name: Clone pinned ACE-Step
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ace-step/ACE-Step-1.5.git ace-step
          cd ace-step
          git checkout --detach "$ACESTEP_COMMIT"
          test "$(git rev-parse HEAD)" = "$ACESTEP_COMMIT"

      - name: Prepare CPU-only ACE-Step environment
        shell: bash
        run: |
          python scripts/prepare_ace_step_cpu.py ace-step
          (cd ace-step && uv sync --no-dev --python "$(command -v python)")

      - name: Build private generation config
        shell: bash
        run: |
          python scripts/write_ace_step_config.py /tmp/request.json ace-step/task.toml
          rm -f /tmp/request.json

      - name: Generate private audio
        shell: bash
        run: |
          set +e
          (cd ace-step && /usr/bin/time -v -o /tmp/ace-step-time.txt \
            uv run --no-sync python cli.py -c task.toml --backend pt) \
            > /tmp/ace-step-generation.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "ACE-Step generation failed with exit code $STATUS; creative-content logs remain runner-local." >&2
            exit "$STATUS"
          fi

          AUDIO=$(find ace-step/output -type f \( -iname '*.wav' -o -iname '*.flac' -o -iname '*.mp3' \) -print -quit)
          if [ -z "$AUDIO" ]; then
            echo "ACE-Step completed without an audio file" >&2
            exit 5
          fi
          ffmpeg -y -v error -i "$AUDIO" -c:a pcm_s16le /tmp/ace-step.wav
          ffprobe -v error -show_entries format=duration,size -of json /tmp/ace-step.wav > /tmp/ffprobe.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          probe = json.loads(Path('/tmp/ffprobe.json').read_text())
          fmt = probe.get('format', {})
          result = {
              'ok': True,
              'provider': 'ace-step-github',
              'upstreamCommit': 'ca1e85fe9430179831e6bc6be790c332190a3866',
              'durationSeconds': float(fmt.get('duration', 0) or 0),
              'sizeBytes': int(fmt.get('size', 0) or 0),
              'completedAt': datetime.now(timezone.utc).isoformat(),
          }
          Path('/tmp/result.json').write_text(json.dumps(result, separators=(',', ':')))
          PY

      - name: Upload audio to private draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          UPLOAD_URL=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.upload_url' | sed 's/{.*//')
          curl --fail-with-body --retry 3 --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: audio/wav" \
            --data-binary @/tmp/ace-step.wav \
            "${UPLOAD_URL}?name=ace-step.wav" > /tmp/audio-upload.json
          curl --fail-with-body --retry 3 --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/result.json \
            "${UPLOAD_URL}?name=result.json" > /tmp/result-upload.json
          echo "Private ACE-Step audio staged successfully."

      - name: Mark private task failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then exit 0; fi
          printf 'ACE-Step task failed in GitHub run %s. No paid fallback was attempted.\n' "$GITHUB_RUN_ID" > /tmp/failure.txt
          UPLOAD_URL=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.upload_url' 2>/dev/null | sed 's/{.*//' || true)
          if [ -n "$UPLOAD_URL" ]; then
            curl --retry 2 --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: text/plain" \
              --data-binary @/tmp/failure.txt \
              "${UPLOAD_URL}?name=failure.txt" >/dev/null || true
          fi
