name: FFmpeg Render

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: URL of the audio file (MP3)
        required: true
      image_url:
        description: URL of the cover image (optional)
        required: false
        default: ''
      output_name:
        description: Output filename e.g. MS-20260822-1234.mp4
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download audio
        run: |
          curl -L --fail --max-time 120 "${{ inputs.audio_url }}" -o audio.mp3
          SIZE=$(stat -c%s audio.mp3)
          echo "Audio size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ] || ! ffmpeg -v error -i audio.mp3 -f null - >/dev/null 2>&1; then
            echo "WARNING: Downloaded audio file is invalid ($SIZE bytes). Generating 30-second silent fallback audio."
            if [ "$SIZE" -lt 10000 ]; then
              echo "Downloaded payload preview:"
              cat audio.mp3
            fi
            ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 30 -c:a libmp3lame -q:a 2 audio.mp3
          fi

      - name: Download or create cover image
        run: |
          if [ -n "${{ inputs.image_url }}" ]; then
            curl -L --fail --max-time 60 "${{ inputs.image_url }}" -o cover.jpg || \
              ffmpeg -y -f lavfi -i color=c=black:size=1024x1024:rate=1 -frames:v 1 cover.jpg
          else
            ffmpeg -y -f lavfi -i color=c=black:size=1024x1024:rate=1 -frames:v 1 cover.jpg
          fi
          SIZE=$(stat -c%s cover.jpg)
          echo "Image size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "WARNING: Cover image very small ($SIZE bytes), regenerating black frame"
            ffmpeg -y -f lavfi -i color=c=black:size=1024x1024:rate=1 -frames:v 1 cover.jpg
          fi

      - name: Render video
        run: |
          ffmpeg -y -loop 1 -i cover.jpg -i audio.mp3 \
            -c:v libx264 -tune stillimage -c:a aac -b:a 192k \
            -pix_fmt yuv420p -shortest \
            "${{ inputs.output_name }}"

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.output_name }}"
          TAG="${TAG%.mp4}"
          gh release create "$TAG" "${{ inputs.output_name }}" \
            --title "Render $TAG" \
            --notes "Auto-rendered by Musica Salvaje" \
            --repo "${{ github.repository }}"
