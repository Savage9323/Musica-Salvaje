name: FFmpeg Render

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: URL of the audio file (MP3/WAV)
        required: true
      image_url:
        description: URL of the cover image (optional)
        required: false
        default: ''
      output_name:
        description: Output filename e.g. MS-20260822-1234.mp4
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download audio
        run: |
          curl -L --fail --retry 3 --retry-delay 2 --max-time 180 "${{ inputs.audio_url }}" -o audio.input
          SIZE=$(stat -c%s audio.input)
          echo "Audio size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: Downloaded audio file is too small ($SIZE bytes) — likely an error page"
            exit 1
          fi
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 audio.input

      - name: Download or create cover image
        run: |
          if [ -n "${{ inputs.image_url }}" ]; then
            curl -L --fail --retry 3 --retry-delay 2 --max-time 90 "${{ inputs.image_url }}" -o cover.input || true
          fi
          if [ ! -s cover.input ]; then
            ffmpeg -y -f lavfi -i color=c=black:size=1024x1024:rate=1 -frames:v 1 cover.jpg
          else
            ffmpeg -y -i cover.input -frames:v 1 -vf "scale=1024:1024:force_original_aspect_ratio=decrease,pad=1024:1024:(ow-iw)/2:(oh-ih)/2" cover.jpg
          fi

      - name: Render video
        run: |
          ffmpeg -y -loop 1 -i cover.jpg -i audio.input \
            -c:v libx264 -preset medium -tune stillimage -c:a aac -b:a 192k \
            -pix_fmt yuv420p -movflags +faststart -shortest \
            "${{ inputs.output_name }}"
          test -s "${{ inputs.output_name }}"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "${{ inputs.output_name }}"

      - name: Upsert release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.output_name }}"
          TAG="${TAG%.mp4}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Render $TAG" --notes "Auto-rendered by Música Salvaje" --repo "${{ github.repository }}"
          fi
          gh release upload "$TAG" "${{ inputs.output_name }}" --clobber --repo "${{ github.repository }}"
