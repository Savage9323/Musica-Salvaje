trigger:
  branches:
    include:
      - main
      - feat/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: UseNode@1
    inputs:
      version: '24.x'
    displayName: Use Node.js 24

  - script: npm install --no-audit --no-fund
    displayName: Install dependencies

  - script: npm run check
    displayName: Typecheck, UI syntax, and tests

  - bash: |
      set -euo pipefail
      command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      ffmpeg -y -f lavfi -i 'sine=frequency=440:duration=1.5' -codec:a libmp3lame -b:a 64k /tmp/mock-tone.mp3
      ffmpeg -y -f lavfi -i 'color=c=black:size=1024x1024:rate=1' -frames:v 1 /tmp/mock-cover.jpg
      test "$(stat -c%s /tmp/mock-tone.mp3)" -gt 10000
      test "$(stat -c%s /tmp/mock-cover.jpg)" -gt 1000
      ffmpeg -y -loop 1 -i /tmp/mock-cover.jpg -i /tmp/mock-tone.mp3 \
        -c:v libx264 -tune stillimage -c:a aac -b:a 128k \
        -pix_fmt yuv420p -shortest /tmp/musica-salvaje-smoke.mp4
      test -s /tmp/musica-salvaje-smoke.mp4
      ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/musica-salvaje-smoke.mp4
    displayName: Free FFmpeg render smoke test
