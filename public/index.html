<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Música Salvaje Studio</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <p class="eyebrow">MÚSICA SALVAJE</p>
    <h1>Automatic Music Studio</h1>
    <p class="sub">Free test mode is enabled by default. It creates finished mock lyrics, two test audio candidates and catalog records without using Suno credits.</p>

    <section class="panel">
      <label for="idea">Song idea</label>
      <textarea id="idea" rows="6" placeholder="Quiero un corrido sobre..."></textarea>
      <div class="row">
        <button id="generate">Generate free test song</button>
        <button id="refresh" class="secondary">Refresh catalog</button>
      </div>
      <pre id="status">Ready.</pre>
    </section>

    <section>
      <h2>Catalog</h2>
      <div id="songs"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
