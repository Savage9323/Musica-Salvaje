# Manual Cloudflare test-studio deployment.
# Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and
# MUSICA_SALVAJE_ADMIN_API_TOKEN as secret Azure Pipeline variables.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: UseNode@1
    inputs:
      version: '24.x'
    displayName: Use Node.js 24

  - script: npm install --no-audit --no-fund
    displayName: Install dependencies

  - script: npm run check
    displayName: Verify repository before deploy

  - bash: |
      set -euo pipefail
      test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
      test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      test -n "$ADMIN_API_TOKEN" || { echo 'Missing MUSICA_SALVAJE_ADMIN_API_TOKEN'; exit 1; }
    displayName: Validate required deployment secrets
    env:
      CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
      CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
      ADMIN_API_TOKEN: $(MUSICA_SALVAJE_ADMIN_API_TOKEN)

  - bash: |
      set -euo pipefail
      npx wrangler r2 bucket list > /tmp/r2-buckets.txt
      if grep -Fq 'musica-salvaje-media' /tmp/r2-buckets.txt; then
        echo 'R2 bucket already exists.'
      else
        npx wrangler r2 bucket create musica-salvaje-media
      fi
    displayName: Ensure private R2 media bucket exists
    env:
      CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
      CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)

  - bash: |
      set -euo pipefail
      node - <<'NODE'
      const fs = require('node:fs');
      const value = process.env.ADMIN_API_TOKEN;
      if (!value) throw new Error('ADMIN_API_TOKEN is empty');
      fs.writeFileSync('/tmp/musica-salvaje-secrets.json', JSON.stringify({ ADMIN_API_TOKEN: value }));
      NODE
      chmod 600 /tmp/musica-salvaje-secrets.json
    displayName: Build temporary Worker secret file
    env:
      ADMIN_API_TOKEN: $(MUSICA_SALVAJE_ADMIN_API_TOKEN)

  - bash: |
      set -euo pipefail
      npx wrangler deploy --secrets-file /tmp/musica-salvaje-secrets.json 2>&1 | tee /tmp/wrangler-deploy.txt
      WORKER_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.txt | tail -n 1)
      test -n "$WORKER_URL" || { echo 'Could not determine workers.dev URL'; exit 1; }
      echo "##vso[task.setvariable variable=WORKER_URL]$WORKER_URL"
    displayName: Deploy locked test Worker and discover URL
    env:
      CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
      CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)

  - bash: |
      set -euo pipefail
      node - <<'NODE'
      const fs = require('node:fs');
      const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
      config.vars.PUBLIC_BASE_URL = process.env.WORKER_URL;
      fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2) + '\n');
      NODE
      npx wrangler deploy --secrets-file /tmp/musica-salvaje-secrets.json
    displayName: Bind canonical public URL and redeploy
    env:
      CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
      CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
      WORKER_URL: $(WORKER_URL)

  - bash: |
      set -euo pipefail
      curl --fail --silent --show-error "$WORKER_URL/health" > /tmp/health.json
      node -e "const x=require('/tmp/health.json'); if(!x.ok || x.mode!=='test') process.exit(1)"

      CODE=$(curl --silent --output /tmp/unauthorized.json --write-out '%{http_code}' "$WORKER_URL/api/budget")
      test "$CODE" = '401'

      curl --fail --silent --show-error \
        -H "Authorization: Bearer $ADMIN_API_TOKEN" \
        "$WORKER_URL/api/budget" > /tmp/budget.json
      node -e "const x=require('/tmp/budget.json'); if(!x.ok || !x.budget.testMode || x.budget.paidGenerationsToday!==0) process.exit(1)"

      curl --fail --silent --show-error \
        -X POST \
        -H "Authorization: Bearer $ADMIN_API_TOKEN" \
        -H 'Content-Type: application/json' \
        --data '{"idea":"Prueba segura de despliegue para Música Salvaje sin usar proveedores pagados","testOnly":true}' \
        "$WORKER_URL/api/songs" > /tmp/song.json

      WORKER_URL="$WORKER_URL" node - <<'NODE'
      const x = require('/tmp/song.json');
      if (!x.ok || x.song.paidGeneration !== false || x.song.status !== 'AUDIO_READY') process.exit(1);
      if (!x.song.audioUrls?.every((url) => url.startsWith(process.env.WORKER_URL))) process.exit(1);
      NODE

      AUDIO_URL=$(node -e "const x=require('/tmp/song.json'); process.stdout.write(x.song.audioUrls[0])")
      curl --fail --silent --show-error "$AUDIO_URL" --output /tmp/test-audio.wav
      test "$(stat -c%s /tmp/test-audio.wav)" -gt 10000
      echo "Cloudflare test Studio passed locked deployment smoke checks at $WORKER_URL"
    displayName: Smoke test deployed locked studio
    env:
      WORKER_URL: $(WORKER_URL)
      ADMIN_API_TOKEN: $(MUSICA_SALVAJE_ADMIN_API_TOKEN)

  - bash: rm -f /tmp/musica-salvaje-secrets.json /tmp/r2-buckets.txt /tmp/wrangler-deploy.txt /tmp/health.json /tmp/budget.json /tmp/song.json /tmp/test-audio.wav /tmp/unauthorized.json
    displayName: Remove temporary secret material
    condition: always()
